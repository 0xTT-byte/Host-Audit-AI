host: prod-docker-01 

network: 
  # Ports allowed to bind on 0.0.0.0 or [::]
  listen_public: 
    - "22/tcp"
    - "80/tcp"
    - "443/tcp"

  # Processes known to be high-risk if exposed publicly 
  critical_services:
    - "postgres"
    - "mysqld"
    - "mariadb"
    - "redis-server"
    - "mongod"
    - "dockerd"
    - "node_exporter"
    - "cadvisor"

auth:
  uid0_allowed: 
    - "root"
  max_auth_tries: 4
  allow_password_auth: false 
  permit_root_login: ["no", "prohibit-password"]
  require_allow_list: true # Require AllowUsers or AllowGroups in sshd_config 

containers: 
  allowed_privileged: []
  allowed_host_network: []
  allowed_docker_sock: []
  dangerous_caps:
    - "SYS_ADMIN"
    - "NET_ADMIN"
    - "SYS_PTRACE"
    - "DAC_OVERRIDE"
  sensitive_mounts:
    - "/"
    - "/etc"
    - "/root"
    - "/proc"
    - "/var/run/docker.sock"
    