[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "host-audit-ai"
version = "0.1.0"
description = "Agentless Linux & Docker host security auditing tool with deterministic baseline diffing and local AI triage"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Security Engineering Team" }
]
dependencies = [
    "pyyaml",
    "pydantic>=2.0",
    "requests",
    "jinja2",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
host-audit = "host_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
