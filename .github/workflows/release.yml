name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  verify-and-build:
    name: Verify, Build & Generate SBOM
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify git tag matches pyproject.toml version
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          PKG_VER=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "Tag version: $TAG_VER | Package version: $PKG_VER"
          if [ "$TAG_VER" != "$PKG_VER" ]; then
            echo "ERROR: Tag version '$TAG_VER' does not match pyproject.toml version '$PKG_VER'" >&2
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Create virtual environment
        run: |
          uv venv --python 3.12 .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> $GITHUB_ENV

      - name: Install core + dev dependencies
        run: uv pip install -e ".[dev]"

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Ruff Formatter Check
        run: ruff format --check .

      - name: Run MyPy Static Analysis
        run: mypy src tests

      - name: Run Pytest (Unit & Security)
        run: pytest -v -m "not e2e"

      - name: Build Wheel and Source Distribution
        run: |
          rm -rf dist release-meta
          uv build
          mkdir -p release-meta

      - name: Inspect Built Wheel Hygiene
        run: |
          python3 - <<'EOF'
          import glob, zipfile
          wheels = glob.glob("dist/*.whl")
          assert len(wheels) == 1, f"Expected single wheel, found {wheels}"
          with zipfile.ZipFile(wheels[0]) as zf:
              names = set(zf.namelist())
          required = [
              "host_audit_ai/collectors/scripts/collect.sh",
              "host_audit_ai/collectors/scripts/host-audit-wrapper.sh",
              "host_audit_ai/engine/baselines/default.yaml",
          ]
          for req in required:
              assert req in names, f"Missing required asset in wheel: {req}"
          forbidden = [n for n in names if "/legacy/" in n or n.startswith("tests/")]
          assert not forbidden, f"Forbidden files present in wheel: {forbidden}"
          print("Wheel audit passed cleanly:", wheels[0])
          EOF

      - name: Generate SHA256SUMS.txt
        run: |
          (cd dist && sha256sum *) > release-meta/SHA256SUMS.txt
          cat release-meta/SHA256SUMS.txt

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: dist
          format: cyclonedx-json
          output-file: release-meta/sbom.cdx.json

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: dist
          format: spdx-json
          output-file: release-meta/sbom.spdx.json

      - name: Upload Distribution Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Upload Checksums and SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: release-meta
          path: release-meta/

  publish-pypi:
    name: Publish to PyPI (OIDC Trusted Publishing)
    needs: verify-and-build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download Distribution Artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub Release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Distribution Artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: release-files

      - name: Download Checksums and SBOMs
        uses: actions/download-artifact@v4
        with:
          name: release-meta
          path: release-files

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-files/*
