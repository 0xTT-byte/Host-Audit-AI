name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Create virtual environment
        run: |
          uv venv --python ${{ matrix.python-version }} .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> $GITHUB_ENV

      - name: Install core + dev dependencies
        run: uv pip install -e ".[dev]"

      - name: Verify zero AI packages in core dev environment
        run: |
          python -c "import importlib.util as u; assert all(u.find_spec(p) is None for p in ['crewai', 'mcp', 'litellm', 'ollama']), 'Forbidden AI package detected in core dev environment'"

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Ruff Formatter Check
        run: ruff format --check .

      - name: Run MyPy Static Analysis
        run: mypy src tests

      - name: Run Pytest (Unit & Security)
        run: pytest -v -m "not e2e"

  e2e-docker:
    name: E2E Docker Live SSH Lab (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Create virtual environment
        run: |
          uv venv --python 3.12 .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> $GITHUB_ENV

      - name: Install core + dev dependencies
        run: uv pip install -e ".[dev]"

      - name: Verify Docker daemon availability
        run: docker info

      - name: Run Docker E2E Test Suite
        run: pytest -v -m e2e
