name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install core + dev dependencies
        run: |
          uv pip install --system -e ".[dev]"

      - name: Verify zero AI packages in core dev environment
        run: |
          python3 -c "import importlib.util as u; assert all(u.find_spec(p) is None for p in ['crewai', 'mcp', 'litellm', 'ollama']), 'Forbidden AI package detected in core dev environment'"

      - name: Run Ruff Linter
        run: uv run ruff check .

      - name: Run Ruff Formatter Check
        run: uv run ruff format --check .

      - name: Run MyPy Static Analysis
        run: uv run mypy src tests

      - name: Run Pytest
        run: uv run pytest -v
